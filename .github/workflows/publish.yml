name: publish

# Publish to PyPI with Trusted Publishing (OIDC) - no API token is stored anywhere.
#
# One-time setup by the owner:
#   https://pypi.org/manage/account/publishing/  ->  "Add a new pending publisher"
#     PyPI project name : slopestab
#     Owner             : lizhengyang-byte
#     Repository name   : slopestab
#     Workflow name     : publish.yml
#     Environment       : pypi
# Then trigger this workflow by publishing a GitHub Release (tag v0.1.0) or
# manually from the Actions tab.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: build dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
